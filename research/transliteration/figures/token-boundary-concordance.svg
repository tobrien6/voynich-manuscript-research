  <g id="text_15">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="47.52" y="67.5" transform="rotate(-0 47.52 67.5)">2,940 common eligible P0 loci • pinned ZL3b / IT2a • case preserved</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(47.52 428.396719)">359 loci have boundary disagreements under both policies.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(47.52 442.8)">Offsets are compared only on identical ASCII chains; different chains are not aligned.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(47.52 478.196992)">3,884 shared present P0 candidates; 944 jointly excluded.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(47.52 491.4)">Related source treatments, not independent samples. Word divisions, glyphs and decipherment remain unresolved.</text>
